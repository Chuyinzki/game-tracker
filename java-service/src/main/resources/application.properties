spring.application.name=java-service
server.port=${JAVA_SERVICE_PORT:3005}
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:app}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:app}
application.rabbit.exchange=${JAVA_RABBITMQ_EXCHANGE:backlog.events}
application.rabbit.queue=${JAVA_RABBITMQ_QUEUE:java-service.notifications}
application.rabbit.routing-key=${JAVA_RABBITMQ_ROUTING_KEY:backlog.item.*}
application.notifications.limit=${JAVA_NOTIFICATION_LIMIT:10}
